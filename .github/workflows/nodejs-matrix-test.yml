name: Matrix Test

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        node-version:
          - 18
          - 20
          - 22

        exclude:
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            package*

      - name: checkout
        uses: actions/checkout@v6

      - name: Deploy
        run: echo "Deploying to production server..."
        env:
          API_TOKEN: ${{ secrets.PROD_SERVER_TOKEN }}            