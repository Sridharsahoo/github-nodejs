name: nodejsproject

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Verify Checkout
        run: |
          echo "Repository checked out successfully"
          ls -la



